<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#6c5ce7"><title>Matemostri</title><style>:root{--ink:#473a88;--pink:#ff77a9;--paper:#fffaf5;--mint:#7bdcb5;--gold:#ffd166;--bad:#e94f64}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:linear-gradient(#fff8fcdd,#fffaf5dd),repeating-linear-gradient(0deg,#d9e9ff 0 1px,transparent 1px 24px),repeating-linear-gradient(90deg,#d9e9ff 0 1px,transparent 1px 24px)}main{max-width:480px;min-height:100vh;margin:auto;padding:18px}.screen{display:none}.screen.on{display:block}h1,h2{margin:.2em 0}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:900;opacity:.65}.card,.pick{background:white;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 #c8c0ed;padding:16px;margin:14px 0}.btn{width:100%;border:0;border-radius:16px;padding:15px;font:inherit;font-size:17px;font-weight:900;background:var(--ink);color:white;box-shadow:0 5px 0 #2f2762}.btn:active,.pick:active{transform:translateY(3px);box-shadow:0 2px 0 #2f2762}.ghost{background:white;color:var(--ink);border:3px solid var(--ink)}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.link{border:0;background:none;color:var(--pink);font-weight:900;text-decoration:underline}.pet{text-align:center;min-height:190px;display:grid;place-items:center}.pet svg{width:180px;filter:drop-shadow(0 9px 8px #473a8830);animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{text-align:center;background:#f8f5ff;border-radius:14px;padding:9px}.stats b{display:block;font-size:21px}.bar{height:16px;background:#eee7ff;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));width:0}.pick{width:100%;display:flex;align-items:center;gap:13px;text-align:left;color:inherit}.pick .sign{font-size:34px;font-weight:900;width:42px;text-align:center}.pick .name{font-size:18px;font-weight:900}.pick small{font-weight:750;opacity:.7}.pick.locked{opacity:.55;box-shadow:none}.lock{margin-left:auto;font-size:22px}.badge{display:inline-block;background:#fff1b8;padding:3px 7px;border-radius:99px;font-size:11px;font-weight:900;color:#825d00}.question{text-align:center;font-size:42px;font-weight:900;padding:24px 0}.answer{text-align:center;font-size:38px;color:var(--pink);font-weight:900;min-height:52px;border-bottom:4px solid var(--pink);width:70%;margin:auto}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.key{padding:16px;border-radius:16px;border:3px solid var(--ink);background:white;color:var(--ink);font-size:23px;font-weight:900;box-shadow:0 4px 0 #c8c0ed}.key.go{background:var(--mint);color:#174c3b}.feedback{text-align:center;min-height:30px;font-size:18px;font-weight:900;margin:10px}.overlay{position:fixed;inset:0;background:#473a88ee;display:none;place-items:center;padding:22px;z-index:9}.overlay.on{display:grid}.modal{max-width:370px;background:white;border-radius:26px;border:4px solid var(--ink);padding:24px;text-align:center}.spark{font-size:55px}.player{width:100%;display:flex;align-items:center;gap:12px;background:white;border:3px solid var(--ink);border-radius:18px;padding:12px;margin:10px 0}.mini svg{width:52px;height:52px}input{width:100%;padding:13px;border:3px solid var(--ink);border-radius:14px;font:inherit;font-size:17px}.ages{display:flex;gap:6px;flex-wrap:wrap}.age{flex:1;padding:9px;border:2px solid var(--ink);border-radius:11px;background:white;font-weight:900}.age.sel{background:var(--ink);color:white}</style></head><body><main><section id="players" class="screen on"><div class="eyebrow">maths adventure</div><h1>Matemostri</h1><div id="playerList"></div><div class="card" id="newBox" hidden><label class="eyebrow">name</label><input id="newName" maxlength="12"><div class="eyebrow" style="margin-top:12px">age</div><div id="ages" class="ages"></div><div class="row" style="margin-top:12px"><button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="create">Create</button></div></div><button class="btn ghost" id="add">+ New player</button></section><section id="home" class="screen"><div class="row between"><div class="eyebrow" id="who"></div><button class="link" id="change">change</button></div><div class="card"><div class="pet" id="homePet"></div><div class="row between"><b>Level <span id="level"></span></b><b id="xpText"></b></div><div class="bar"><i id="xpFill"></i></div></div><div class="stats"><div><b id="total"></b><small>XP</small></div><div><b id="right"></b><small>right</small></div><div><b id="best"></b><small>best streak</small></div></div><p><button class="btn" id="practise">Practise</button></p></section><section id="menu" class="screen"><div class="row between"><button class="link" id="back">back</button><span class="eyebrow" id="toLevel"></span></div><h2>Choose a challenge</h2><p>Complex challenges award XP much faster.</p><div id="choices"></div></section><section id="play" class="screen"><div class="row between"><button class="link" id="exit">exit</button><b id="progress"></b></div><div class="card"><div class="question" id="question"></div><div class="answer" id="answer">?</div><div class="feedback" id="feedback"></div></div><div class="pad" id="pad"></div></section><section id="end" class="screen"><div class="eyebrow">session finished</div><h1 id="endTitle">Well done!</h1><div class="card"><div class="pet" id="endPet"></div><div class="stats"><div><b id="earned"></b><small>XP earned</small></div><div><b id="score"></b><small>right</small></div><div><b id="endLevel"></b><small>level</small></div></div></div><button class="btn" id="again">Practise again</button><p><button class="btn ghost" id="den">Back to the den</button></p></section></main><div class="overlay" id="unlock"><div class="modal"><div class="spark">✨🔓✨</div><div class="eyebrow">new challenge unlocked</div><h2 id="unlockTitle"></h2><p id="unlockText"></p><button class="btn" id="unlockOk">Try it!</button></div></div><script>const $=x=>document.getElementById(x),KEY='matemostri:v4',OPS=[['add','+','Addition',5,14],['sub','−','Subtraction',8,20],['mul','×','Multiplication',20,34],['div','÷','Division',40,70]];let db=JSON.parse(localStorage.getItem(KEY)||'{"players":[],"current":null}'),P=null,S=null,newAge=9;const save=()=>localStorage.setItem(KEY,JSON.stringify(db)),need=l=>60+30*l+6*l*l,show=id=>{document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0)};function pet(level){let c=['#ffe29a','#ffd5e7','#d4f6df','#d8e8ff','#eadcff','#ffd9bf','#cff5f5','#ffd8f2'][Math.min(7,Math.floor((level-1)/3))],w=level>=15;return `<svg viewBox="0 0 120 120"><path d="M91 82q24 2 12 19" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round"/><ellipse cx="40" cy="38" rx="12" ry="20" fill="${c}" stroke="#473a88" stroke-width="3" transform="rotate(-22 40 38)"/><ellipse cx="80" cy="38" rx="12" ry="20" fill="${c}" stroke="#473a88" stroke-width="3" transform="rotate(22 80 38)"/>${w?'<path d="M31 62Q8 45 7 70q13 3 24-8M89 62q23-17 24 8-13 3-24-8" fill="#fff" stroke="#473a88" stroke-width="3"/>':''}<ellipse cx="60" cy="76" rx="37" ry="35" fill="${c}" stroke="#473a88" stroke-width="3"/><ellipse cx="60" cy="90" rx="22" ry="16" fill="#fff" opacity=".7"/><ellipse cx="49" cy="68" rx="8" ry="9" fill="#fff"/><ellipse cx="71" cy="68" rx="8" ry="9" fill="#fff"/><circle cx="51" cy="70" r="4.5" fill="#473a88"/><circle cx="69" cy="70" r="4.5" fill="#473a88"/><circle cx="49" cy="67" r="1.7" fill="#fff"/><circle cx="67" cy="67" r="1.7" fill="#fff"/><circle cx="40" cy="81" r="6" fill="#ff9fbd"/><circle cx="80" cy="81" r="6" fill="#ff9fbd"/><path d="M52 83q8 9 16 0" fill="none" stroke="#473a88" stroke-width="3" stroke-linecap="round"/>${level>=20?'<path d="M43 34l6-15 11 10 11-10 6 15z" fill="#ffd166" stroke="#473a88" stroke-width="3"/>':''}</svg>`}function migrate(p){p.unlocked=p.unlocked||{add:false,sub:false,mul:false,div:false};p.total=p.total||0;p.xp=p.xp||0;p.level=p.level||1;p.right=p.right||0;p.best=p.best||0;return p}db.players.forEach(migrate);function renderPlayers(){$('playerList').innerHTML='';db.players.forEach(p=>{let b=document.createElement('button');b.className='player';b.innerHTML=`<span class="mini">${pet(p.level)}</span><span><b>${p.name}</b><br><small>level ${p.level} · ${p.total} XP</small></span>`;b.onclick=()=>{P=p;db.current=p.id;save();renderHome();show('home')};$('playerList').appendChild(b)})}function renderHome(){$('who').textContent=P.name;$('homePet').innerHTML=pet(P.level);$('level').textContent=P.level;$('xpText').textContent=P.xp+'/'+need(P.level)+' XP';$('xpFill').style.width=100*P.xp/need(P.level)+'%';$('total').textContent=P.total;$('right').textContent=P.right;$('best').textContent=P.best}function renderMenu(){let left=need(P.level)-P.xp;$('toLevel').textContent=left+' XP to level '+(P.level+1);$('choices').innerHTML='';OPS.forEach(o=>[['simple',o[3],false],['complex',o[4],!P.unlocked[o[0]]]].forEach(v=>{let b=document.createElement('button'),locked=v[2];b.className='pick'+(locked?' locked':'');b.innerHTML=`<span class="sign">${o[1]}</span><span><span class="name">${v[0][0].toUpperCase()+v[0].slice(1)} ${o[2]}</span><br><small>${locked?'Score 8/10 in simple to unlock':v[1]+' XP per answer'}</small>${!locked&&v[0]=='complex'?'<br><span class="badge">FASTER XP</span>':''}</span>${locked?'<span class="lock">🔒</span>':''}`;if(!locked)b.onclick=()=>start(o,v[0],v[1]);$('choices').appendChild(b)}))}function makeQ(op,mode){let a,b,ans;if(op=='add'){a=rnd(mode=='simple'?1:25,mode=='simple'?20:999);b=rnd(mode=='simple'?1:25,mode=='simple'?20:999);ans=a+b}if(op=='sub'){a=rnd(mode=='simple'?5:100,mode=='simple'?30:999);b=rnd(1,a);ans=a-b}if(op=='mul'){a=rnd(2,mode=='simple'?10:99);b=rnd(2,mode=='simple'?10:12);ans=a*b}if(op=='div'){b=rnd(2,mode=='simple'?10:20);ans=rnd(2,mode=='simple'?10:30);a=b*ans}return {text:`${a} ${OPS.find(x=>x[0]==op)[1]} ${b} =`,ans}}const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));function start(o,mode,xp){S={op:o[0],name:o[2],mode,xp,i:0,right:0,earned:0,streak:0,input:'',q:null};show('play');next()}function next(){if(S.i==10)return finish();S.i++;S.input='';S.q=makeQ(S.op,S.mode);$('progress').textContent=S.i+'/10';$('question').textContent=S.q.text;$('answer').textContent='?';$('feedback').textContent=''}function press(k){if(k=='⌫')S.input=S.input.slice(0,-1);else if(k=='✓'){if(!S.input)return;if(+S.input==S.q.ans){S.right++;P.right++;S.streak++;P.best=Math.max(P.best,S.streak);let gain=Math.round(S.xp*(S.streak>=6?1.5:S.streak>=3?1.2:1));S.earned+=gain;P.total+=gain;P.xp+=gain;while(P.xp>=need(P.level)){P.xp-=need(P.level);P.level++}$('feedback').textContent='Correct! ✨';save();setTimeout(next,550)}else{S.streak=0;$('feedback').textContent='Almost. Try again.';S.input=''}return}else if(S.input.length<6)S.input+=k;$('answer').textContent=S.input||'?'}function finish(){$('endTitle').textContent=S.right>=8?'Great session!':'Well done!';$('endPet').innerHTML=pet(P.level);$('earned').textContent='+'+S.earned;$('score').textContent=S.right+'/10';$('endLevel').textContent=P.level;show('end');if(S.mode=='simple'&&S.right>=8&&!P.unlocked[S.op]){P.unlocked[S.op]=true;save();$('unlockTitle').textContent='Complex '+S.name;$('unlockText').textContent='Brilliant work! You can now try harder questions and earn XP much faster.';$('unlock').classList.add('on')}}$('pad').innerHTML='';['1','2','3','4','5','6','7','8','9','⌫','0','✓'].forEach(k=>{let b=document.createElement('button');b.className='key'+(k=='✓'?' go':'');b.textContent=k;b.onclick=()=>press(k);$('pad').appendChild(b)});function ages(){$('ages').innerHTML='';[6,7,8,9,10,11].forEach(a=>{let b=document.createElement('button');b.className='age'+(a==newAge?' sel':'');b.textContent=a;b.onclick=()=>{newAge=a;ages()};$('ages').appendChild(b)})}$('add').onclick=()=>{$('newBox').hidden=false;ages()};$('cancel').onclick=()=>{$('newBox').hidden=true};$('create').onclick=()=>{let n=$('newName').value.trim();if(!n)return;P=migrate({id:Date.now(),name:n,age:newAge,level:1,xp:0,total:0,right:0,best:0,unlocked:{add:false,sub:false,mul:false,div:false}});db.players.push(P);db.current=P.id;save();renderPlayers();renderHome();show('home')};$('change').onclick=()=>{renderPlayers();show('players')};$('practise').onclick=()=>{renderMenu();show('menu')};$('back').onclick=()=>{renderHome();show('home')};$('exit').onclick=()=>{renderHome();show('home')};$('again').onclick=()=>{renderMenu();show('menu')};$('den').onclick=()=>{renderHome();show('home')};$('unlockOk').onclick=()=>{$('unlock').classList.remove('on');renderMenu();show('menu')};renderPlayers();if(db.current){P=db.players.find(x=>x.id==db.current);if(P){renderHome();show('home')}}</script></body></html>
