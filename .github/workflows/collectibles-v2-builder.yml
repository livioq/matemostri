name: Build Collectibles v2 branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collectibles-v2-implementation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply implementation
        run: node tools/apply-collectibles-v2.js

      - name: Run existing test suite
        run: node tests/arithmetic-model.test.js

      - name: Run Collectibles v2 tests
        run: node tests/collectibles-v2.test.js

      - name: Remove one-shot branch machinery
        run: |
          git rm tools/apply-collectibles-v2.js
          git rm .github/workflows/apply-collectibles-v2.yml

      - name: Commit verified branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/arithmetic-model.test.js tests/collectibles-v2.test.js
          git commit -m "Implement progression-aware treasure hunting"
          git push origin HEAD:collectibles-v2-implementation
